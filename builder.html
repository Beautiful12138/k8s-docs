        return { matchType: 'ancestor', item: ancestor, normalized };
      }

      return null;
    }

    function compactCommentText(text, limit = 52) {
      const normalized = String(text || '').replace(/\s+/g, ' ').trim();
      if (!normalized) return '';
      return normalized.length > limit ? `${normalized.slice(0, limit - 3)}...` : normalized;
    }

    function lineCommentForPath(resourceKey, actualPath) {
      const match = resourceKey ? findKnowledgeMatch(resourceKey, actualPath) : null;
      if (match?.item) {
        const shortText = compactCommentText(match.item.comment || match.item.description || '已匹配知识库说明', 34);
        return shortText;
      }
      if (resourceKey) return '未收录字段，请结合原始 YAML 与集群版本复核';
      return '未识别资源类型，暂无法提供字段说明';
    }

    function formatYamlScalar(value) {
      return safeYamlDump(value).replace(/\n/g, ' ');
    }

    function renderAnnotatedObjectEntries(value, parentPath, indent, resourceKey, lines) {
      Object.entries(value || {}).forEach(([key, child]) => {
        const path = parentPath ? `${parentPath}.${key}` : key;
        const prefix = `${'  '.repeat(indent)}${key}:`;
        const comment = lineCommentForPath(resourceKey, path);

        if (Array.isArray(child)) {
          if (!child.length) {
            lines.push(`${prefix} []${comment ? `  # ${comment}` : ''}`);
          } else {
            lines.push(`${prefix}${comment ? `  # ${comment}` : ''}`);
            renderAnnotatedArrayEntries(child, path, indent + 1, resourceKey, lines);
          }
          return;
        }

        if (child && typeof child === 'object') {
          const keys = Object.keys(child);
          if (!keys.length) {
            lines.push(`${prefix} {}${comment ? `  # ${comment}` : ''}`);
          } else {
            lines.push(`${prefix}${comment ? `  # ${comment}` : ''}`);
            renderAnnotatedObjectEntries(child, path, indent + 1, resourceKey, lines);
          }
          return;
        }

        lines.push(`${prefix} ${formatYamlScalar(child)}${comment ? `  # ${comment}` : ''}`);
      });
    }

    function renderAnnotatedArrayEntries(value, parentPath, indent, resourceKey, lines) {
      value.forEach((item) => {
        const arrayPath = `${parentPath}[]`;
        const comment = lineCommentForPath(resourceKey, arrayPath);
        const prefix = `${'  '.repeat(indent)}-`;

        if (Array.isArray(item)) {
          if (!item.length) {
            lines.push(`${prefix} []${comment ? `  # ${comment}` : ''}`);
          } else {
            lines.push(`${prefix}${comment ? `  # ${comment}` : ''}`);
            renderAnnotatedArrayEntries(item, arrayPath, indent + 1, resourceKey, lines);
          }
          return;
        }

        if (item && typeof item === 'object') {
          const keys = Object.keys(item);
          if (!keys.length) {
            lines.push(`${prefix} {}${comment ? `  # ${comment}` : ''}`);
          } else {
            lines.push(`${prefix}${comment ? `  # ${comment}` : ''}`);
            renderAnnotatedObjectEntries(item, arrayPath, indent + 1, resourceKey, lines);
          }
          return;
        }

        lines.push(`${prefix} ${formatYamlScalar(item)}${comment ? `  # ${comment}` : ''}`);
      });
    }

    function splitBodyAndInlineComment(rawLine) {
      const line = String(rawLine || '');
      const idx = line.indexOf(' #');
      if (idx === -1) {
        return {
          body: line,
          comment: ''
        };
      }
      return {
        body: line.slice(0, idx),
        comment: line.slice(idx + 3).trim()
      };
    }

    function normalizeOptionValue(value) {
      return String(value ?? '').trim().replace(/^['"]|['"]$/g, '').toLowerCase();
    }

    function dedupeBy(items, keyFn) {
      const map = new Map();
      items.forEach((item) => {
        const key = keyFn(item);
        if (!map.has(key)) map.set(key, item);
      });
      return [...map.values()];
    }

    function addLimitedUnique(list, value, limit = 3) {
      if (!value || list.includes(value) || list.length >= limit) return;
      list.push(value);
    }

    function validateWorkloadSelectorConsistency(resourceKey, doc, issues) {
      if (!['Deployment', 'StatefulSet'].includes(resourceKey)) return;

      const selector = resolveSchemaPath(doc, 'spec.selector.matchLabels');
      const templateLabels = resolveSchemaPath(doc, 'spec.template.metadata.labels');
      if (!selector.found || !templateLabels.found) return;
      if (!selector.value || typeof selector.value !== 'object' || Array.isArray(selector.value)) return;
      if (!templateLabels.value || typeof templateLabels.value !== 'object' || Array.isArray(templateLabels.value)) return;

      const missingKeys = Object.entries(selector.value)
        .filter(([key, value]) => !Object.prototype.hasOwnProperty.call(templateLabels.value, key) || templateLabels.value[key] !== value)
        .map(([key]) => key);

      if (missingKeys.length) {
        issues.push({
          severity: 'warning',
          path: `spec.selector.matchLabels.${missingKeys[0]}`,
          paths: [
            ...missingKeys.map((key) => `spec.selector.matchLabels.${key}`),
            'spec.template.metadata.labels'
          ],
          message: `spec.selector.matchLabels 中的 ${missingKeys.join('、')} 未在 spec.template.metadata.labels 中以相同值出现，Deployment 将无法正确匹配到自己创建的 Pod。`
        });
      }
    }

    function analyzeDocument(doc, index) {
      const issues = [];
      if (!doc || typeof doc !== 'object' || Array.isArray(doc)) {
        return {
          index,
          kindName: '',
          resourceKey: '',
          apiVersion: '',
          name: '',
          namespace: '',
          knownFields: [],
          unknownFields: [],
          issues: [{ severity: 'error', message: '当前文档不是合法的 K8s 对象结构。' }]
        };
      }

      const kindName = String(doc.kind || '').trim();
      const apiVersion = String(doc.apiVersion || '').trim();
      const metadata = doc.metadata && typeof doc.metadata === 'object' ? doc.metadata : {};
      const name = String(metadata.name || '').trim();
      const namespace = String(metadata.namespace || '').trim() || 'default';
      const resourceKey = resourceKindLookup.value.get(kindName.toLowerCase()) || '';

      if (!kindName) issues.push({ severity: 'error', path: 'kind', message: '缺少 kind。' });
      if (!apiVersion) issues.push({ severity: 'warning', path: 'apiVersion', message: '缺少 apiVersion。' });
      if (!name) issues.push({ severity: 'warning', path: 'metadata.name', message: '缺少 metadata.name。' });
      if (!resourceKey) {
        issues.push({ severity: 'warning', message: kindName ? `当前知识库尚未收录 kind=${kindName}。` : '无法根据 kind 匹配当前知识库。' });
      }

      const rawPaths = dedupeBy(collectUsedPaths(doc), (item) => item.actualPath);
      const knownMap = new Map();
      const unknownFields = [];

      rawPaths.forEach((entry) => {
        const match = resourceKey ? findKnowledgeMatch(resourceKey, entry.actualPath) : null;

        if (match) {
          const key = match.item.path;
          const aggregate = knownMap.get(key) || {
            knowledgePath: key,
            displayPath: match.item.displayPath,
            type: match.item.type,
            description: match.item.description || match.item.comment || '该字段已被当前知识库匹配到。',
            matchType: match.matchType,
            examples: [],
            values: []
          };

          if (aggregate.matchType !== 'exact' && match.matchType === 'exact') {
            aggregate.matchType = 'exact';
          }

          addLimitedUnique(aggregate.examples, entry.actualPath);
          if (entry.scalarValue !== undefined) addLimitedUnique(aggregate.values, summarizeScalar(entry.scalarValue));
          knownMap.set(key, aggregate);

          if (match.matchType === 'exact' && match.item.options?.length && entry.scalarValue !== undefined) {
            const currentValue = normalizeOptionValue(entry.scalarValue);
            const valid = match.item.options.some((option) => normalizeOptionValue(option) === currentValue);
            if (!valid) {
              issues.push({
                severity: 'warning',
                path: entry.actualPath,
                message: `${entry.actualPath} 的值 "${summarizeScalar(entry.scalarValue)}" 不在建议选项中：${match.item.options.join(' / ')}。`
              });
            }
          }
        } else {
          unknownFields.push({
            actualPath: entry.actualPath,
            valueSummary: entry.valueSummary,
            reason: resourceKey ? '当前 JSON 词典与骨架中没有收录该路径，可能是新字段、版本差异、手写扩展或拼写问题。' : '由于当前资源类型未被识别，暂时无法给出参数说明。'
          });
        }
      });

      validateWorkloadSelectorConsistency(resourceKey, doc, issues);

      return {
        index,
        kindName,
        resourceKey,
        apiVersion,
        name,
        namespace,
        knownFields: [...knownMap.values()].sort((a, b) => {
          if (a.matchType !== b.matchType) return a.matchType === 'exact' ? -1 : 1;
          return a.displayPath.localeCompare(b.displayPath);
        }),
        unknownFields: dedupeBy(unknownFields, (item) => item.actualPath),
        issues: dedupeBy(issues, (item) => `${item.severity}:${item.message}`)
      };
    }

    function formatYamlError(error) {
      if (error && error.mark) {
        return `第 ${error.mark.line + 1} 行，第 ${error.mark.column + 1} 列：${error.reason || error.message}`;
      }
      return error?.message || '未知 YAML 解析错误';
    }

    function analyzeYamlInput() {
      analysisError.value = '';
      analysisResults.value = [];
      analysisDocuments.value = [];

      const text = String(analysisInput.value || '').trim();
      if (!text) {
        analysisError.value = '请先粘贴或上传 YAML 内容。';
        return;
      }

      try {
        const docs = [];
        jsyaml.loadAll(text, (doc) => docs.push(doc));
        if (!docs.length) {
          throw new Error('未识别到任何 YAML 文档。');
        }

        analysisDocuments.value = docs;
        analysisResults.value = docs.map((doc, index) => analyzeDocument(doc, index));
        showToast(`已完成 ${docs.length} 个 YAML 文档分析`);
      } catch (error) {
        analysisDocuments.value = [];
        analysisError.value = formatYamlError(error);
      }
    }

    function handleYamlFileChange(event) {
      const [file] = event.target.files || [];
      if (!file) return;

      importedFileName.value = file.name;
      const reader = new FileReader();
      reader.onload = () => {
        analysisInput.value = String(reader.result || '');
        analyzeYamlInput();
      };
      reader.onerror = () => {
        analysisError.value = '读取文件失败，请重试。';
      };
      reader.readAsText(file, 'utf-8');
    }

    function openYamlFilePicker() {
      yamlFileInput.value?.click();
    }

    const analysisSummary = computed(() => {
      return analysisResults.value.reduce((summary, doc) => {
        summary.documents += 1;
        if (doc.resourceKey) summary.recognized += 1;
        summary.unknown += doc.unknownFields.length;
        summary.issues += doc.issues.length;
        return summary;
      }, { documents: 0, recognized: 0, unknown: 0, issues: 0 });
    });

    const analysisSourceLines = computed(() => {
      const lines = buildYamlCompareLines(analysisInput.value);
      let docIndex = 0;

      return lines.map((line) => {
        const decorated = {
          ...line,
          docIndex,
          resourceKey: analysisResults.value[docIndex]?.resourceKey || ''
        };

        if (String(line.raw || '').trim() === '---') {
          docIndex += 1;
        }

        return decorated;
      });
    });

    const analysisAnnotatedLines = computed(() => {
      return analysisSourceLines.value.map((line) => {
        const trimmed = String(line.raw || '').trim();
        if (!trimmed || trimmed === '---' || trimmed.startsWith('#')) {
          return { ...line };
        }

        const { body } = splitBodyAndInlineComment(line.raw);
        const parsedComment = lineCommentForPath(line.resourceKey, line.path || line.normalizedPath);
        if (!parsedComment) return { ...line };

        return {
          ...line,
          raw: `${body}  # ${parsedComment}`
        };
      });
    });

    const analysisAnnotatedYaml = computed(() => {
      return analysisAnnotatedLines.value.map((line) => line.raw).join('\n');
    });

    function compareLineMatchesPath(line, candidatePath) {
      const linePath = normalizePath(line?.normalizedPath || line?.path || '');
      const target = normalizePath(candidatePath || '');
      if (!linePath || !target) return false;
      return linePath === target || linePath.startsWith(target + '.') || target.startsWith(linePath + '.');
    }

    function compareLineExactPath(line, candidatePath) {
      const linePath = normalizePath(line?.normalizedPath || line?.path || '');
      const target = normalizePath(candidatePath || '');
      if (!linePath || !target) return false;
      return linePath === target;
    }

    function getCompareLineMeta(line) {
      const doc = analysisResults.value[line?.docIndex];
      if (!doc) return { tone: '', label: '', message: '' };

      const unknown = doc.unknownFields.find((field) => compareLineExactPath(line, field.actualPath));
      if (unknown) {
        return {
          tone: 'danger',
          label: '未知字段',
          message: unknown.reason || '当前字段未被知识库收录'
        };
      }

      const issue = doc.issues.find((item) => {
        const paths = Array.isArray(item.paths) ? item.paths : [item.path].filter(Boolean);
        return paths.some((path) => compareLineExactPath(line, path));
      });
      if (issue) {
        return {
          tone: 'warning',
          label: '问题提示',
          message: itemSafeMessage(issue)
        };
      }

      return { tone: '', label: '', message: '' };
    }

    function itemSafeMessage(issue) {
      return String(issue?.message || '').trim();
    }

    function getManualDetailForLine(line) {
      if (!line?.resourceKey) return null;
      if (getCompareLineMeta(line).tone) return null;

      const match = findKnowledgeMatch(line.resourceKey, line.path || line.normalizedPath);
      if (!match?.item) return null;

      return {
        displayPath: match.item.displayPath || line.path || line.normalizedPath,
        type: match.item.type || 'Field',
        description: match.item.description || match.item.comment || '当前字段暂无更详细说明。',
        demo: match.item.demo || '',
        matchType: match.matchType
      };
    }

    function closeManualDetail() {
      activeManualDetail.value = null;
    }

    function stripInlineCommentPreservingIndent(line) {
      if (!line) return '';
      const hashIndex = line.indexOf(' #');
      return hashIndex >= 0 ? line.slice(0, hashIndex) : line;
    }

    function buildYamlCompareLines(text) {
      const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
      const result = [];
      const stack = [];
      let lastPath = '';

      lines.forEach((raw, index) => {
        const trimmed = raw.trim();
        const lineData = {
          lineNumber: index + 1,
          raw,
          path: '',
          normalizedPath: '',
          clickable: false
        };

        if (!trimmed) {
          result.push(lineData);
          return;
        }

        if (trimmed === '---') {
          stack.length = 0;
          lastPath = '';
          result.push(lineData);
          return;
        }

        if (trimmed.startsWith('#')) {
          lineData.path = lastPath;
          lineData.normalizedPath = normalizePath(lastPath);
          lineData.clickable = Boolean(lineData.normalizedPath);
          result.push(lineData);
          return;
        }

        const indentSpaces = (raw.match(/^ */) || [''])[0].length;
        const indentLevel = Math.floor(indentSpaces / 2);
        const content = stripInlineCommentPreservingIndent(trimmed).trim();

        while (stack.length > indentLevel) stack.pop();

        if (content.startsWith('- ')) {
          const afterDash = content.slice(2).trim();
          const parentPath = stack[indentLevel - 1] || '';
          const arrayPath = parentPath ? `${parentPath}[]` : '[]';
          let currentPath = arrayPath;

          if (afterDash.includes(':')) {
            const colonIndex = afterDash.indexOf(':');
            const key = afterDash.slice(0, colonIndex).trim();
            currentPath = `${arrayPath}.${key}`;
          }

          stack[indentLevel] = arrayPath;
          lineData.path = currentPath;
          lineData.normalizedPath = normalizePath(currentPath);
          lineData.clickable = Boolean(lineData.normalizedPath);
          lastPath = currentPath || lastPath;
          result.push(lineData);
          return;
        }

        if (content.includes(':')) {
          const colonIndex = content.indexOf(':');
          const key = content.slice(0, colonIndex).trim();
          const parentPath = stack[indentLevel - 1] || '';
          const currentPath = parentPath ? `${parentPath}.${key}` : key;
          stack[indentLevel] = currentPath;
          lineData.path = currentPath;
          lineData.normalizedPath = normalizePath(currentPath);
          lineData.clickable = Boolean(lineData.normalizedPath);
          lastPath = currentPath;
          result.push(lineData);
          return;
        }

        lineData.path = lastPath;
        lineData.normalizedPath = normalizePath(lastPath);
        lineData.clickable = Boolean(lineData.normalizedPath);
        result.push(lineData);
      });

      return result;
    }

    function selectComparePath(line) {
      if (!line?.normalizedPath) return;
      activeComparePath.value = activeComparePath.value === line.normalizedPath ? '' : line.normalizedPath;
    }

    function handleAnnotatedLineClick(line) {
      selectComparePath(line);
      const detail = getManualDetailForLine(line);
      if (detail) {
        activeManualDetail.value = detail;
      }
    }

    function copyAnalysisSourceYaml() {
      if (!analysisInput.value.trim()) {
        showToast('当前没有可复制的原始 YAML');
        return;
      }
      copyText(analysisInput.value, '原始 YAML 已复制');
    }

    function copyAnnotatedAnalysisYaml() {
      if (!analysisAnnotatedYaml.value.trim()) {
        showToast('当前没有可复制的注释版 YAML');
        return;
      }
      copyText(analysisAnnotatedYaml.value, '注释版 YAML 已复制');
    }

    function highlightPreview() {
      if (!previewCodeEl.value || !window.hljs) return;
      previewCodeEl.value.querySelectorAll('code.language-yaml').forEach((block) => {
        block.removeAttribute('data-highlighted');
        hljs.highlightElement(block);
      });
    }

    watch(buildOutputYaml, () => nextTick(highlightPreview));
    watch(includeComments, () => nextTick(highlightPreview));
    watch(activeBuilderId, () => nextTick(highlightPreview));
    watch(analysisInput, () => {
      activeComparePath.value = '';
    });
    watch(analysisAnnotatedYaml, () => {
      activeComparePath.value = '';
    });

    watch(activeBuilder, (doc) => {
      if (!doc && builderResources.value.length) {
        activeBuilderId.value = builderResources.value[0].id;
        return;
      }
      if (!doc) {
        buildWizardStep.value = 1;
      }
    }, { immediate: true });

    watch(builderFieldGroups, (groups) => {
      if (!groups.length) {
        activeBuilderGroupLabel.value = '';
        activeBuilderFieldLineKey.value = '';
        return;
      }
      if (!groups.some((group) => group.label === activeBuilderGroupLabel.value)) {
        activeBuilderGroupLabel.value = groups[0].label;
      }
    }, { immediate: true });

    watch(activeBuilderGroupFields, (lines) => {
      if (!lines.length) {
        activeBuilderFieldLineKey.value = '';
        return;
      }
      if (!lines.some((line) => line.lineKey === activeBuilderFieldLineKey.value)) {
        activeBuilderFieldLineKey.value = lines[0].lineKey;
      }
    }, { immediate: true });

    async function loadData() {
      loading.value = true;
      loadError.value = '';

      try {
        const [dictResp, schemaResp] = await Promise.all([
          fetch('./k8s-dict.json'),
          fetch('./k8s-schema.json')
        ]);

        if (!dictResp.ok) throw new Error(`k8s-dict.json HTTP ${dictResp.status}: ${dictResp.statusText}`);
        if (!schemaResp.ok) throw new Error(`k8s-schema.json HTTP ${schemaResp.status}: ${schemaResp.statusText}`);

        const [dictData, schemaData] = await Promise.all([
          dictResp.json(),
          schemaResp.json()
        ]);

        k8sDict.value = dictData;
        schemaStore.value = schemaData;
        newResourceKey.value = schemaData.defaultResource || schemaData.resourceOrder?.[0] || 'Deployment';

        loading.value = false;
      } catch (error) {
        loading.value = false;
        loadError.value = `无法加载数据文件：${error.message}。请确认 builder.html、index.html、k8s-dict.json、k8s-schema.json 位于同一目录，并通过静态服务器或 GitHub Pages 访问。`;
      }
    }

    onMounted(() => {
      loadData();
    });

    return {
      activeBuildWarnings,
      activeBuilder,
      activeBuilderId,
      activeBuilderEnabledCount,
      activeBuilderIndex,
      activeBuilderField,
      activeBuilderFieldIndex,
      activeBuilderFieldLineKey,
      activeBuilderGroupFields,
      activeBuilderGroup,
      activeBuilderGroupIndex,
      activeBuilderGroupLabel,
      activeManualDetail,
      activeQuickFields,
      activeTab,
      activeComparePath,
      analysisError,
      analysisAnnotatedLines,
      analysisInput,
      analysisAnnotatedYaml,
      analysisImportOpen,
      analysisOverviewOpen,
      analysisResults,
      analysisSourceLines,
      analysisSummary,
      analyzeYamlInput,
      activateBuilderDocument,
      appendNextResourceToYaml,
      applyPreset,
      applySmartBinding,
      buildWizardAlerts,
      buildStepBadgeClass,
      buildStepButtonClass,
      buildPreviewDocs,
      buildSteps,
      buildWizardStep,
      buildOutputYaml,
      builderFieldGroups,
      builderResources,
      builderSearch,
      stepFieldSearch,
      canAdvanceBuildStep,
      canAppendResourceToYaml,
      canOpenBuildStep,
      changeBuilderResourceKind,
      copyAnnotatedAnalysisYaml,
      copyAnalysisSourceYaml,
      copyBuildYaml,
      copyImportedOriginalYaml,
      closeManualDetail,
      currentBuildStepMeta,
      currentBuildStepLines,
      currentBuildStepContextHints,
      currentBuildStepVisibleLines,
      downloadBuildYaml,
      fieldLinePreview,
      isFieldCardCollapsed,
      getBuilderDocumentName,
      getBuilderDocumentNamespace,
      getCompareLineMeta,
      goBuildStep,
      handleYamlFileChange,
      importAllAnalysisToBuilder,
      importAnalysisDocument,
      importedFileName,
      includeComments,
      loadData,
      loadError,
      loading,
      newResourceKey,
      openYamlFilePicker,
      previewCodeEl,
      prevBuildStep,
      prevBuilderField,
      prevBuilderGroup,
      quickFieldLabel,
      quickFieldQuestion,
      removeBuilderResource,
      resourceList,
      nextBuildStep,
      nextBuilderField,
      nextBuilderGroup,
      handleAnnotatedLineClick,
      toggleFieldCard,
      selectComparePath,
      selectBuilderField,
      selectBuilderGroup,
      sendBuildYamlToAnalyzer,
      showEnabledOnly,
      showOptionalStepFields,
      showSmartBindingForLine,
      smartBindingCandidates,
      stepFieldPlaceholder,
      stepFieldQuestion,
      toastMessage,
      toastVisible,
      toggleLine,
      totalDictEntries,
      updateCustomBlock,
      updateLineValue,
      yamlFileInput,
      addBuilderResource
    };
  }
}).mount('#app');
</script>
